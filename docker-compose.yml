services:
  backend:
    build: ./backend-rest
    ports:
      - "3000:3000"
    env_file:
      - ./backend-rest/.env
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
